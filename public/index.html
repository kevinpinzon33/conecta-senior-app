<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Conecta Senior</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#181B21" />

<!-- iOS: hace que se comporte como app al agregarla a pantalla de inicio -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Conecta Senior" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />

<!-- Tipografias de marca (conectasenior.com.co): Cormorant Garamond (titulos) + Raleway (cuerpo) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="screen"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="inicio">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tab" data-tab="alertas">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span>Alertas</span>
      <span class="tab-badge" id="alertBadge" hidden></span>
    </button>
    <button class="tab" data-tab="perfil">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>
