<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Conecta Senior</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#181B21" />

<!-- iOS: hace que se comporte como app al agregarla a pantalla de inicio -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Conecta Senior" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />

<!-- Tipografias de marca (conectasenior.com.co): Cormorant Garamond (titulos) + Raleway (cuerpo) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="screen"></main>
  <!-- Las pestañas se dibujan desde JS porque dependen del rol -->
  <nav class="tabbar" id="tabbar" hidden></nav>
</div>

<!-- El orden importa: comun define lo que usan los demas, y app.js
     arranca la aplicacion, asi que va de ultimo. -->
<script src="comun.js"></script>
<script src="login.js"></script>
<script src="vista-mayor.js"></script>
<script src="vista-contacto.js"></script>
<script src="app.js"></script>
</body>
</html>
